<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>

  <!-- Modern Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#3b82f6" stroke-width="2" />

  <!-- Circular Loop Cycle (Deadlock Cycle) -->
  <path d="M 32 13 A 19 19 0 1 1 13 32" stroke="url(#ringGrad)" stroke-width="4" stroke-linecap="round" />
  <!-- Arrow tip on loop -->
  <polygon points="13,26 8,34 17,35" fill="#38bdf8" />

  <!-- Process Node (Green Circle) -->
  <circle cx="47" cy="20" r="5.5" fill="#10b981" stroke="#ffffff" stroke-width="1.8" />

  <!-- Resource Node (Red Square) -->
  <rect x="42" y="41" width="10" height="10" rx="2.5" fill="#ef4444" stroke="#ffffff" stroke-width="1.8" />

  <!-- Center Lock / Deadlock Emblem -->
  <rect x="23" y="29" width="18" height="16" rx="4" fill="#fbbf24" stroke="#b45309" stroke-width="1.5" />
  <path d="M 27 29 V 23.5 C 27 20.2 37 20.2 37 23.5 V 29" stroke="#fef3c7" stroke-width="3" stroke-linecap="round" fill="none" />
  <circle cx="32" cy="36" r="2" fill="#78350f" />
  <path d="M 32 38 V 41" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" />
</svg>
