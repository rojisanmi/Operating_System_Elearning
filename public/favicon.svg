<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="paperGrad" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#1d4ed8" stroke-width="1.5" />

  <!-- Notepad Paper Body -->
  <g filter="url(#shadow)">
    <rect x="10" y="9" width="44" height="46" rx="7" fill="url(#paperGrad)" stroke="#e2e8f0" stroke-width="1.2" />

    <!-- Top Paper Header Strip -->
    <path d="M 10 16 C 10 12.1 13.1 9 17 9 L 47 9 C 50.9 9 54 12.1 54 16 L 54 17.5 L 10 17.5 Z" fill="#3b82f6" />

    <!-- Spiral Notebook Rings -->
    <rect x="15" y="6" width="3.5" height="6.5" rx="1.75" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" />
    <rect x="24.5" y="6" width="3.5" height="6.5" rx="1.75" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" />
    <rect x="34" y="6" width="3.5" height="6.5" rx="1.75" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" />
    <rect x="43.5" y="6" width="3.5" height="6.5" rx="1.75" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" />

    <!-- Text: SISOP -->
    <text x="32" y="30.5" text-anchor="middle" fill="#0f172a" font-family="'Poppins', sans-serif" font-weight="900" font-size="11.5" letter-spacing="0.8px">SISOP</text>

    <!-- Ruled Note Lines with Bullet Dots -->
    <circle cx="16" cy="37" r="1.5" fill="#3b82f6" />
    <line x1="21" y1="37" x2="45" y2="37" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

    <circle cx="16" cy="43" r="1.5" fill="#10b981" />
    <line x1="21" y1="43" x2="38" y2="43" stroke="#cbd5e1" stroke-width="1.75" stroke-linecap="round" />

    <circle cx="16" cy="48.5" r="1.5" fill="#f59e0b" />
    <line x1="21" y1="48.5" x2="33" y2="48.5" stroke="#cbd5e1" stroke-width="1.75" stroke-linecap="round" />

    <!-- Pencil / Pen Accent at Bottom Right -->
    <g transform="translate(38, 38) rotate(35)">
      <!-- Pencil Body -->
      <rect x="0" y="0" width="4.5" height="15" rx="1" fill="#f59e0b" stroke="#d97706" stroke-width="0.5" />
      <!-- Eraser -->
      <rect x="0" y="-3.5" width="4.5" height="3.5" rx="0.8" fill="#f43f5e" />
      <rect x="0" y="-0.8" width="4.5" height="1.2" fill="#94a3b8" />
      <!-- Tip -->
      <polygon points="0,15 4.5,15 2.25,19" fill="#fde68a" />
      <polygon points="1.2,17.2 3.3,17.2 2.25,19" fill="#1e293b" />
    </g>
  </g>
</svg>
